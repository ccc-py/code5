<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code5 - AI Coding Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        if (typeof marked === 'undefined') {
            console.error('marked.js not loaded');
        }
        marked.setOptions({
            breaks: true,
            gfm: true
        });
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #2d2d2d;
            padding: 1rem;
            border-bottom: 1px solid #3e3e3e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.2rem;
            color: #4ec9b0;
        }
        .session-info {
            font-size: 0.9rem;
            color: #888;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 80%;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            line-height: 1.5;
        }
        .message.user {
            background: #264f78;
            align-self: flex-end;
        }
        .message.assistant {
            background: #2d2d2d;
            align-self: flex-start;
        }
        .message .role {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 0.3rem;
        }
        .message pre {
            background: #1e1e1e;
            padding: 0.5rem;
            border-radius: 4px;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .message code {
            background: #2d2d2d;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: monospace;
        }
        .message pre code {
            background: transparent;
            padding: 0;
        }
        .message p {
            margin: 0.5rem 0;
        }
        .message ul, .message ol {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }
        .message blockquote {
            border-left: 3px solid #4ec9b0;
            padding-left: 0.8rem;
            margin: 0.5rem 0;
            color: #888;
        }
        #input-area {
            background: #2d2d2d;
            padding: 1rem;
            border-top: 1px solid #3e3e3e;
            display: flex;
            gap: 0.5rem;
        }
        #message-input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid #3e3e3e;
            border-radius: 4px;
            background: #1e1e1e;
            color: #d4d4d4;
            font-size: 1rem;
        }
        #message-input:focus {
            outline: none;
            border-color: #4ec9b0;
        }
        #send-btn {
            padding: 0.8rem 1.5rem;
            background: #4ec9b0;
            color: #1e1e1e;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #send-btn:hover {
            background: #3db892;
        }
        #send-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .loading {
            color: #888;
            font-style: italic;
        }
        #sessions-panel {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 300px;
            height: 100%;
            background: #252526;
            border-left: 1px solid #3e3e3e;
            padding: 1rem;
            z-index: 100;
        }
        #sessions-panel.open {
            display: block;
        }
        #sessions-panel h2 {
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .session-item {
            padding: 0.5rem;
            margin: 0.3rem 0;
            background: #2d2d2d;
            border-radius: 4px;
            cursor: pointer;
        }
        .session-item:hover {
            background: #3e3e3e;
        }
        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Code5 - AI Coding Agent</h1>
        <div class="session-info">
            <button id="sessions-btn">Sessions</button>
            | Session: <span id="current-session">-</span>
        </div>
    </header>

    <div id="chat-container"></div>

    <div id="input-area">
        <input type="text" id="message-input" placeholder="輸入訊息..." autocomplete="off">
        <button id="send-btn">傳送</button>
    </div>

    <div id="sessions-panel">
        <button class="close-btn" id="close-sessions">&times;</button>
        <h2>Sessions</h2>
        <button id="new-session-btn" style="margin-bottom: 1rem; padding: 0.5rem;">+ New Session</button>
        <div id="sessions-list"></div>
    </div>

    <script>
        let currentSessionId = null;
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const sessionsPanel = document.getElementById('sessions-panel');
        const sessionsList = document.getElementById('sessions-list');
        const currentSessionSpan = document.getElementById('current-session');

        async function createSession() {
            const res = await fetch('/api/sessions', { method: 'POST' });
            const data = await res.json();
            currentSessionId = data.session_id;
            currentSessionSpan.textContent = currentSessionId;
            chatContainer.innerHTML = '';
            loadSessions();
        }

        async function loadSessions() {
            const res = await fetch('/api/sessions');
            const sessions = await res.json();
            sessionsList.innerHTML = sessions.map(s => 
                `<div class="session-item" data-id="${s.session_id}">
                    ${s.session_id} (${s.message_count} messages)
                </div>`
            ).join('');
        }

        async function switchSession(sessionId) {
            currentSessionId = sessionId;
            currentSessionSpan.textContent = sessionId;
            const res = await fetch(`/api/sessions/${sessionId}`);
            const data = await res.json();
            chatContainer.innerHTML = '';
            for (const msg of data.history) {
                addMessage(msg.role, msg.content);
            }
            sessionsPanel.classList.remove('open');
        }

        async function deleteSession(sessionId) {
            if (!confirm('Delete this session?')) return;
            await fetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
            if (currentSessionId === sessionId) {
                await createSession();
            }
            loadSessions();
        }

        function unescapeSSE(text) {
            return text.replace(/\\n/g, '\n').replace(/\\r/g, '\r').replace(/\\\\/g, '\\');
        }

        function renderMarkdown(text) {
            const unescaped = unescapeSSE(text);
            if (typeof marked !== 'undefined' && marked.parse) {
                try {
                    return marked.parse(unescaped);
                } catch (e) {
                    console.error('Markdown parse error:', e);
                    return escapeHtml(text);
                }
            }
            return escapeHtml(text);
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const renderedContent = role === 'assistant' ? renderMarkdown(content) : escapeHtml(content);
            div.innerHTML = `<div class="role">${role === 'user' ? '你' : 'Code5'}</div>${renderedContent}`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage('user', message);
            messageInput.value = '';
            sendBtn.disabled = true;

            const responseDiv = document.createElement('div');
            responseDiv.className = 'message assistant';
            responseDiv.innerHTML = `<div class="role">Code5</div><div class="response-content"></div>`;
            chatContainer.appendChild(responseDiv);
            const contentDiv = responseDiv.querySelector('.response-content');
            let responseText = '';

            try {
                const res = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message: message,
                        session_id: currentSessionId
                    })
                });

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                }

                let newSessionId = currentSessionId;
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    try {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const data = line.slice(6).trim();
                                if (!data || data === '[DONE]') continue;
                                if (data.startsWith('{')) {
                                    try {
                                        const obj = JSON.parse(data);
                                        if (obj.session_id) newSessionId = obj.session_id;
                                    } catch {}
                                    continue;
                                }
                                responseText += data;
                                contentDiv.innerHTML = renderMarkdown(responseText);
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            }
                        }
                    } catch (streamErr) {
                        console.error('Stream error:', streamErr);
                        break;
                    }
                }

                currentSessionId = newSessionId;
                currentSessionSpan.textContent = currentSessionId;
                loadSessions();
            } catch (err) {
                console.error('Fetch error:', err);
                contentDiv.textContent = '錯誤: ' + err.message;
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('sessions-btn').addEventListener('click', () => {
            loadSessions();
            sessionsPanel.classList.add('open');
        });
        document.getElementById('close-sessions').addEventListener('click', () => {
            sessionsPanel.classList.remove('open');
        });
        document.getElementById('new-session-btn').addEventListener('click', createSession);
        sessionsList.addEventListener('click', (e) => {
            const item = e.target.closest('.session-item');
            if (item) switchSession(item.dataset.id);
        });

        createSession();
    </script>
</body>
</html>
